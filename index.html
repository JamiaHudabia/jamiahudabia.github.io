<style>
  :root{
    --teal-950:#0B2622; --teal-900:#0E332C; --teal-800:#154A40; --teal-700:#1C5C4F; --teal-600:#276F5F;
    --gold:#C9A24B; --gold-light:#E7CD8A; --gold-soft:#F3E7C8;
    --bg:#F6F4EC; --card:#FFFFFF;
    --ink:#1E2620; --muted:#66756A; --line:#E4DFCE;
    --ok:#3F7A56; --ok-bg:#E5F1E8; --bad:#B14A3B; --bad-bg:#F7E7E3;
    --radius:16px; --shadow:0 4px 18px rgba(14,51,44,.07), 0 1px 3px rgba(14,51,44,.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Amiri',serif;}
  [dir="rtl"]{font-family:'Noto Nastaliq Urdu','Work Sans',sans-serif;}
  [dir="rtl"] .stat-row,[dir="rtl"] .grid2,[dir="rtl"] .grid3,[dir="rtl"] .card-grid{direction:rtl;}
  [dir="rtl"] table th, [dir="rtl"] table td{text-align:right;}
  a{color:inherit;}

  /* ===== Top navbar ===== */
  .topnav{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--teal-900),var(--teal-800));color:#F2F6EE;box-shadow:0 2px 14px rgba(0,0,0,.12);}
  .topnav-inner{max-width:1240px;margin:0 auto;padding:0 22px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .arch{width:30px;height:30px;flex-shrink:0;}
  .brand-text{line-height:1.15;}
  .brand-text .b1{font-size:15px;font-weight:700;color:var(--gold-light);font-family:'Amiri',serif;}
  .brand-text .b2{font-size:10.5px;color:rgba(242,246,238,.65);}
  nav.mainnav{display:flex;align-items:center;gap:4px;}
  nav.mainnav button{all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:14px;color:rgba(242,246,238,.82);}
  nav.mainnav button:hover{background:rgba(255,255,255,.08);}
  nav.mainnav button.active{background:rgba(255,255,255,.12);color:var(--gold-light);font-weight:600;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .lang-toggle{display:flex;border:1.5px solid rgba(242,246,238,.35);border-radius:24px;overflow:hidden;}
  .lang-toggle button{all:unset;cursor:pointer;padding:6px 14px;font-size:12.5px;font-weight:600;color:rgba(242,246,238,.85);}
  .lang-toggle button.on{background:var(--gold);color:var(--teal-950);}
  .hamburger{display:none;all:unset;cursor:pointer;padding:8px;color:#F2F6EE;}
  .mobile-drawer{display:none;position:fixed;inset:0;z-index:40;background:rgba(11,38,34,.55);}
  .mobile-drawer .panel{background:var(--teal-900);width:78%;max-width:300px;height:100%;padding:24px 18px;display:flex;flex-direction:column;gap:6px;}
  .mobile-drawer button.navitem{all:unset;cursor:pointer;padding:12px 14px;border-radius:10px;color:#F2F6EE;font-size:15px;}
  .mobile-drawer button.navitem.active{background:rgba(255,255,255,.1);color:var(--gold-light);}
  .bell-wrap{position:relative;}
  .bell-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(242,246,238,.35);display:flex;align-items:center;justify-content:center;color:#F2F6EE;position:relative;}
  .bell-btn svg{width:16px;height:16px;}
  .bell-dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:#E4604F;}
  .bell-panel{position:absolute;top:44px;right:0;width:320px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20;max-height:380px;overflow-y:auto;}
  [dir="rtl"] .bell-panel{right:auto;left:0;}
  .bell-panel .bn-item{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;}
  .bell-panel .bn-item .bn-time{color:var(--muted);font-size:11px;margin-top:3px;}
  .bell-panel .bn-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}
  .bell-panel .bn-head{padding:12px 16px;font-weight:700;color:var(--teal-900);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
  .bell-panel .bn-head button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);}

  main{max-width:1240px;margin:0 auto;padding:32px 22px 70px;}
  .page-title{font-size:30px;margin:0 0 6px;color:var(--teal-900);}
  .page-sub{color:var(--muted);margin:0 0 26px;font-size:14.5px;}

  /* ===== Hero ===== */
  .hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:30px;min-height:300px;display:flex;align-items:flex-end;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,38,34,.15) 0%,rgba(11,38,34,.55) 55%,rgba(11,38,34,.92) 100%);}
  .hero-content{position:relative;z-index:1;padding:36px 34px 30px;color:#fff;}
  .hero-content .eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);font-weight:700;margin-bottom:8px;}
  .hero-content h1{font-size:clamp(28px,4vw,42px);margin:0 0 8px;color:#fff;}
  .hero-content p{margin:0;font-size:15px;color:rgba(255,255,255,.85);max-width:560px;}

  /* ===== Cards & grids ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;box-shadow:var(--shadow);}
  .card h3{margin:0 0 16px;font-size:17px;color:var(--teal-900);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr;} }

  .prayer-card{background:linear-gradient(160deg,var(--teal-900),var(--teal-800));color:#F2F6EE;border-radius:14px;padding:16px;text-align:center;}
  .prayer-card .pname{font-size:12.5px;color:var(--gold-light);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .prayer-card .ptime{font-family:'Amiri',serif;font-size:22px;margin-top:6px;}
  .prayer-card .pedit{all:unset;cursor:pointer;font-size:11px;color:rgba(242,246,238,.55);margin-top:6px;display:block;}

  .announce-card{background:var(--gold-soft);border:1px solid var(--gold-light);border-radius:12px;padding:14px 16px;position:relative;}
  .announce-card .ann-text{font-size:14px;color:var(--teal-900);}
  .announce-card .ann-del{all:unset;cursor:pointer;position:absolute;top:10px;right:12px;color:var(--muted);font-size:11px;}
  [dir="rtl"] .announce-card .ann-del{right:auto;left:12px;}

  .class-chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;font-weight:600;color:var(--teal-900);box-shadow:var(--shadow);position:relative;}
  .class-chip .cls-del{all:unset;cursor:pointer;position:absolute;top:8px;right:10px;color:var(--muted);font-size:11px;}
  [dir="rtl"] .class-chip .cls-del{right:auto;left:10px;}

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;margin-top:12px;font-weight:600;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);outline-offset:1px;border-color:var(--gold);}
  textarea{resize:vertical;min-height:60px;}
  .btn{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--teal-800),var(--teal-900));color:var(--gold-light);padding:11px 22px;border-radius:10px;font-size:14px;font-weight:700;display:inline-block;margin-top:16px;box-shadow:0 3px 10px rgba(14,51,44,.25);}
  .btn:hover{filter:brightness(1.12);}
  .btn.small{padding:7px 14px;font-size:12.5px;margin:0;box-shadow:none;}
  .btn.secondary{background:transparent;color:var(--teal-900);border:1px solid var(--line);box-shadow:none;}
  .btn.danger{background:var(--bad);color:#fff;box-shadow:none;}

  .section-heading{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .section-heading:first-child{margin-top:0;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .pill.income,.pill.present{background:var(--ok-bg);color:var(--ok);}
  .pill.expense,.pill.absent{background:var(--bad-bg);color:var(--bad);}

  .stat-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .stat{flex:1;min-width:170px;background:linear-gradient(150deg,var(--teal-900),var(--teal-700));color:#F2F6EE;border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .stat .icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .stat .icon svg{width:17px;height:17px;color:var(--gold-light);}
  .stat .num{font-size:24px;font-family:'Amiri',serif;color:var(--gold-light);}
  .stat .lbl{font-size:12px;color:rgba(242,246,238,.72);margin-top:2px;}

  .lock{text-align:center;padding:44px 20px;max-width:380px;margin:0 auto;}
  .lock .lock-icon{width:52px;height:52px;border-radius:50%;background:var(--teal-900);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .lock .lock-icon svg{width:22px;height:22px;color:var(--gold-light);}
  .empty{color:var(--muted);font-size:13.5px;font-style:italic;padding:14px 0;text-align:center;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;}
  .list-item:last-child{border-bottom:none;}
  .row-actions button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-inline-start:12px;}
  .row-actions button:hover{color:var(--bad);}
  .edit-badge{background:var(--gold-light);color:var(--teal-900);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .roll{font-family:'Amiri',serif;color:var(--gold);font-weight:700;}
  .search-hero{background:linear-gradient(160deg,var(--teal-900),var(--teal-700));border-radius:20px;padding:40px 30px;text-align:center;color:#fff;margin-bottom:26px;}
  .search-hero h2{color:#fff;margin:0 0 8px;}
  .search-hero p{color:rgba(255,255,255,.75);margin:0 0 20px;font-size:14px;}
  .search-box{display:flex;gap:10px;max-width:480px;margin:0 auto;}
  .search-box input{flex:1;border:none;padding:13px 16px;border-radius:10px;}
  .avatar-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--teal-950);font-family:'Amiri',serif;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .progress-bar{background:var(--line);border-radius:20px;height:9px;overflow:hidden;margin-top:8px;}
  .progress-bar > div{background:linear-gradient(90deg,var(--ok),#5fae7d);height:100%;}
  .doc-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .doc-list li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--teal-900);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .doc-list li svg{width:16px;height:16px;color:var(--ok);flex-shrink:0;}
  #debugBanner{display:none;background:#F7E7E3;border:1px solid var(--bad);color:#7A2E22;padding:12px 16px;border-radius:10px;font-size:12.5px;margin-bottom:18px;white-space:pre-wrap;}
  footer.sitefoot{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 22px 40px;}

  @media (max-width:860px){
    nav.mainnav{display:none;}
    .hamburger{display:block;}
    .brand-text .b2{display:none;}
  }
  @media (max-width:640px){
    main{padding:20px 14px 50px;}
    .hero-content{padding:24px 20px 22px;}
    .card{padding:18px 18px;}
    .stat-row{flex-direction:column;}
  }
  .mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .mchip{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
  .mchip.ok{background:var(--ok-bg);color:var(--ok);} .mchip.bad{background:var(--bad-bg);color:var(--bad);}
  .pill.leave{background:#FBF1D4;color:#8A6410;}
  .guard{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
  .att-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .att-toolbar > div{min-width:170px;}
  .rchip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;margin-inline-start:4px;}
  .rchip.bad{background:var(--bad-bg);color:var(--bad);} .rchip.warn{background:#FBF1D4;color:#8A6410;} .rchip.ok{background:var(--ok-bg);color:var(--ok);}
  .rcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff;}
  .rhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:14px;}
  .rsec{padding:6px 0;border-top:1px dotted var(--line);font-size:13.5px;line-height:1.9;}
  .rmeta{padding-top:6px;border-top:1px dotted var(--line);font-size:13px;color:var(--muted);}
  .rnote{margin-top:6px;padding:8px 10px;background:var(--gold-soft);border-radius:8px;font-size:13px;}
  .dr-grid{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1280px;}
  .dr-grid th,.dr-grid td{border:1px solid var(--line);padding:4px;text-align:center;vertical-align:middle;}
  .dr-grid thead th{background:var(--teal-900);color:var(--gold-light);font-weight:600;padding:6px 4px;}
  .dr-grid thead tr.grp th{background:var(--teal-800);}
  .dr-grid input,.dr-grid select{width:100%;min-width:56px;padding:6px 5px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .dr-grid td.nm{text-align:start;min-width:130px;font-weight:600;}
  .dr-actions a,.dr-actions button.drWa{all:unset;cursor:pointer;display:inline-block;padding:5px 10px;border-radius:8px;border:1px solid var(--ok);color:var(--ok);font-size:12px;font-weight:700;white-space:nowrap;}
  .dr-actions button.drWa.sent{background:var(--ok);color:#fff;}
  .dr-actions button.drWa[disabled]{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--muted);}
  .dr-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .dr-msg{font-size:13.5px;margin:10px 0;min-height:1.2em;} .dr-msg.ok{color:var(--ok);} .dr-msg.err{color:var(--bad);}
  .tablewrap{overflow-x:auto;}
  @media (max-width:900px){
    .dr-grid{min-width:0;} .dr-grid thead{display:none;}
    .dr-grid,.dr-grid tbody,.dr-grid tr,.dr-grid td{display:block;width:100%;}
    .dr-grid tr{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;padding:8px;background:#fff;}
    .dr-grid td{border:none;display:flex;gap:8px;align-items:center;justify-content:space-between;text-align:start;padding:4px 2px;}
    .dr-grid td::before{content:attr(data-label);flex:0 0 42%;font-size:12px;color:var(--muted);}
    .dr-grid td.nm{font-size:15px;} .dr-grid td.nm::before,.dr-grid td.sn::before{display:none;}
    .dr-grid input,.dr-grid select{flex:1;}
  }
  .hint-box{font-size:12.5px;color:var(--muted);background:var(--gold-soft);border-radius:8px;padding:8px 10px;margin:6px 0 4px;}
  .dr-warn{margin:10px 0;padding:10px 14px;border:1px solid #E0B94F;background:#FFF7DD;border-radius:10px;font-size:13px;color:#6B4E0A;}
  .dr-warn ul{margin:6px 0 0;padding-inline-start:20px;} .dr-warn li{margin:3px 0;}

.stph{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--line,#ccc);vertical-align:middle;margin-inline-end:8px;cursor:pointer;background:#ddd;flex:none}
.stph.ph{display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:#8a8f98;cursor:default}
.stph.big{width:120px;height:150px;border-radius:12px;margin:0}
#photoLb{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;padding:20px}
#photoLb img{max-width:90vw;max-height:70vh;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.photobox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fill,48mm);gap:2mm;justify-content:center}
.idcard{width:48mm;height:76mm;box-sizing:border-box;border:.3mm solid #1c7a3e;border-radius:2.5mm;background:#fff;color:#2b1d0e;position:relative;overflow:hidden;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:inherit}
.idcard .hd{width:100%;background:#fff;padding:1.6mm 0 0;display:flex;flex-direction:column;align-items:center;gap:.3mm}
.idcard .hd img.e{height:9.5mm;display:block}.idcard .hd img.u{width:40mm;display:block}
.idcard .band{width:100%;background:#1c7a3e;color:#fff;font-size:5.6pt;font-weight:700;letter-spacing:.2mm;padding:.8mm 0;border-top:.5mm solid #d4a017;border-bottom:.5mm solid #d4a017}
.idcard .cp{width:16mm;height:16mm;border-radius:50%;object-fit:cover;border:.7mm solid #d4a017;margin-top:1.6mm;background:#8a8f98;color:#fff;font-size:18pt;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.idcard .cn{font-size:8.2pt;font-weight:800;line-height:1.12;margin-top:1mm;padding:0 1.5mm;color:#1c5a30;word-break:break-word}
.idcard .gd{font-size:6.4pt;font-weight:700;color:#5a3a1a;line-height:1.15;padding:0 1.5mm;word-break:break-word}
.idcard .cm{font-size:6.6pt;margin-top:.5mm;color:#5a3a1a;font-weight:600}
.idcard .cq{width:16.5mm;height:16.5mm;margin-top:1mm;background:#fff}.idcard .cq img,.idcard .cq canvas{width:16.5mm!important;height:16.5mm!important;display:block}

let sessTok=false;
function mfaL(){ return (typeof lang!=='undefined'&&lang==='ur') ? {

 locked:'بہت زیادہ غلط کوڈ۔ 15 منٹ بعد کوشش کریں۔', on:'آن ہے', off:'بند ہے', turnOn:'آن کریں', turnOff:'بند کریں',
 setupNote:'1) گوگل آتھنٹیکیٹر (یا کوئی بھی آتھنٹیکیٹر ایپ) انسٹال کریں۔ 2) نیچے کا QR اسکین کریں یا چابی ہاتھ سے لکھیں۔ 3) ایپ میں نظر آنے والا 6 ہندسوں کا کوڈ لکھ کر تصدیق کریں۔',
 key:'خفیہ چابی', done:'دو مرحلہ تصدیق آن ہو گئی۔ براہِ کرم دوبارہ لاگ ان کریں۔', offDone:'دو مرحلہ تصدیق بند ہو گئی۔ براہِ کرم دوبارہ لاگ ان کریں۔',
 offNote:'بند کرنے کے لیے اپنا موجودہ 6 ہندسوں کا کوڈ لکھیں۔', fail:'کچھ غلط ہو گیا۔' } : {
 title:'Two-step verification', askNote:'Enter the 6-digit code from your authenticator app.', code:'6-digit code', ok:'Confirm', cancel:'Cancel', bad:'Wrong code. Please try again.',
 locked:'Too many wrong codes. Please wait 15 minutes.', on:'On', off:'Off', turnOn:'Turn on', turnOff:'Turn off',
 setupNote:'1) Install Google Authenticator (or any authenticator app). 2) Scan the QR code below, or type the key by hand. 3) Enter the 6-digit code shown in the app to finish.',

function mfaOverlay(inner){
  const d=document.createElement('div'); d.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:14px';
  d.setAttribute('dir',(typeof lang!=='undefined'&&lang==='ur')?'rtl':'ltr');
  d.innerHTML='<div class="card" style="max-width:380px;width:100%;margin:0;max-height:92vh;overflow:auto">'+inner+'</div>'; document.body.appendChild(d); return d;
}
function mfaCodeForm(L, note, extra){
  return '<h3 style="margin-top:0">'+L.title+'</h3><p style="font-size:13px;color:var(--muted)">'+note+'</p>'+(extra||'')+'<form novalidate autocomplete="off"><input name="c" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="one-time-code" placeholder="'+L.code+'" style="text-align:center;letter-spacing:6px;font-size:20px"><div class="mfaErr" style="color:#e66;font-size:13px;min-height:18px;margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="margin:0">'+L.ok+'</button><button type="button" class="btn secondary mfaX" style="margin:0">'+L.cancel+'</button></div></form>';
}
function mfaAsk(u,p){
  return new Promise(resolve=>{
    const L=mfaL(); const d=mfaOverlay(mfaCodeForm(L,L.askNote));
    const er=d.querySelector('.mfaErr'), inp=d.querySelector('input'); inp.focus();
    d.querySelector('.mfaX').onclick=()=>{ d.remove(); resolve(null); };
    d.querySelector('form').onsubmit=async e=>{
      e.preventDefault(); er.textContent=''; const c=inp.value.replace(/\s/g,'');
      if(!/^\d{6}$/.test(c)){ er.textContent=L.bad; return; }
      try{
        const {data,error}=await sb.rpc('mfa_login',{p_username:u,p_password:p,p_code:c}); if(error) throw error;
        const r=data&&data[0];
        if(r&&r.r_token){ d.remove(); resolve(r); }
        else if(r&&r.r_role==='locked'){ d.remove(); resolve({locked:true}); }
        else { er.textContent=L.bad; inp.value=''; inp.focus(); }
      }catch(ex){ er.textContent=L.bad; }
    };
  });
}
/* login helper: if the server says 'mfa', ask for the code and swap the password for a 12h session token */
async function mfaGate(u,p,data,errEl,lockedMsg){
  if(data!=='mfa') return {role:data,pw:p};
  const r=await mfaAsk(u,p); if(!r) return null;
  if(r.locked){ if(errEl) errEl.textContent=lockedMsg||mfaL().locked; return null; }
  sessTok=true; return {role:r.r_role,pw:r.r_token};
}
function mfaBye(u,p){
  if(sessTok && u && p){ try{ sb.rpc('logout_session',{p_username:u,p_token:p}).then(()=>{},()=>{}); }catch(e){} }
  sessTok=false;
}
function mfaIssuer(){ return (location.pathname||'').indexOf('ahtramulhaq')>=0 ? 'Jamia Hudabia Finance' : 'Jamia Hudabia'; }
async function mfaTurnOn(getU,getP,host,after){
  const L=mfaL(); let s='';
  try{ const {data,error}=await sb.rpc('mfa_begin',{p_username:getU(),p_password:getP()}); if(error) throw error; s=String(data||''); }catch(e){ toast(L.fail,'err'); return; }
  const uri='otpauth://totp/'+encodeURIComponent(mfaIssuer()+':'+getU())+'?secret='+s+'&issuer='+encodeURIComponent(mfaIssuer())+'&algorithm=SHA1&digits=6&period=30';
  const d=mfaOverlay(mfaCodeForm(L,L.setupNote,'<div class="mfaQR" style="display:flex;justify-content:center;background:#fff;padding:8px;border-radius:10px;margin:6px 0"></div><div style="font-size:12px;color:var(--muted)">'+L.key+':</div><div class="mfaKey" dir="ltr" style="font-family:monospace;font-size:14px;word-break:break-all;margin:2px 0 10px;user-select:all"></div>'));
  d.querySelector('.mfaKey').textContent=s.replace(/(.{4})/g,'$1 ').trim();
  try{ new QRCode(d.querySelector('.mfaQR'),{text:uri,width:176,height:176,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  const er=d.querySelector('.mfaErr'), inp=d.querySelector('input'); inp.focus();
  d.querySelector('.mfaX').onclick=()=>d.remove();
  d.querySelector('form').onsubmit=async e=>{
    e.preventDefault(); er.textContent=''; const c=inp.value.replace(/\s/g,'');
    if(!/^\d{6}$/.test(c)){ er.textContent=L.bad; return; }
    try{ const {data,error}=await sb.rpc('mfa_confirm',{p_username:getU(),p_password:getP(),p_code:c}); if(error) throw error;
      if(data===true){ d.remove(); if(host) host.remove(); toast(L.done,'ok'); after(); } else { er.textContent=L.bad; inp.value=''; inp.focus(); }
    }catch(ex){ er.textContent=L.bad; }
  };
}
function mfaTurnOff(getU,getP,host,after){
  const L=mfaL(); const d=mfaOverlay(mfaCodeForm(L,L.offNote));
  const er=d.querySelector('.mfaErr'), inp=d.querySelector('input'); inp.focus();
  d.querySelector('.mfaX').onclick=()=>d.remove();
  d.querySelector('form').onsubmit=async e=>{
    e.preventDefault(); er.textContent=''; const c=inp.value.replace(/\s/g,'');
    if(!/^\d{6}$/.test(c)){ er.textContent=L.bad; return; }
    try{ const {data,error}=await sb.rpc('mfa_disable',{p_username:getU(),p_password:getP(),p_code:c}); if(error) throw error;
      if(data===true){ d.remove(); if(host) host.remove(); toast(L.offDone,'ok'); after(); } else { er.textContent=L.bad; inp.value=''; inp.focus(); }
    }catch(ex){ er.textContent=L.bad; }
  };
}
async function mfaInject(host,getU,getP,after){
  if(!host) return; const card=host.querySelector('.card'); if(!card) return; const L=mfaL();
  const box=document.createElement('div'); box.className='mfaBox'; box.style.cssText='margin-top:14px;padding-top:12px;border-top:1px solid rgba(128,128,128,.3)';
  box.innerHTML='<div style="font-weight:700;font-size:14px">'+L.title+'</div><div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="mfaSt" style="font-size:13px;color:var(--muted)">…</span><button type="button" class="btn secondary small mfaBtn" style="margin:0" disabled>…</button></div>';
  card.appendChild(box);
  const st=box.querySelector('.mfaSt'), bt=box.querySelector('.mfaBtn'); let on=false;
  try{ const {data,error}=await sb.rpc('mfa_status',{p_username:getU(),p_password:getP()}); if(error) throw error; on=!!data; }catch(e){ box.remove(); return; }
  st.textContent=on?L.on:L.off; bt.textContent=on?L.turnOff:L.turnOn; bt.disabled=false;
  bt.onclick=()=> on ? mfaTurnOff(getU,getP,host,after) : mfaTurnOn(getU,getP,host,after);
}

function toast(msg,kind){
  let box=document.getElementById('toastBox'); if(!box){ box=document.createElement('div'); box.id='toastBox'; document.body.appendChild(box); }
  const d=document.createElement('div'); d.className='toast'+(kind==='err'?' err':''); d.textContent=msg; box.appendChild(d);

function todayInPakistan(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Karachi'});
}
function to12Hour(hhmm){
  const clean = hhmm.split(' ')[0]; // strip any "(PKT)" style suffix
  const [h,m] = clean.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = h%12===0 ? 12 : h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
async function syncPrayerTimesIfNeeded(){

  if(content.prayerDate === today) return; // already today's times

// ---- Urdu display helpers (names, classes, prayer names/times, categories, currency, notifications)
const CLS_UR={'Hifz':'حفظ','Nazira':'ناظرہ'};
const PRAYER_UR={'Fajr':'فجر','Dhuhr':'ظہر','Zuhr':'ظہر','Asr':'عصر','Maghrib':'مغرب','Isha':'عشاء','Jumuah':'جمعہ','Jummah':'جمعہ','Jumma':'جمعہ','Sunrise':'طلوعِ آفتاب','Ishraq':'اشراق','Zawal':'زوال','Tahajjud':'تہجد'};
const CAT_UR={'Monthly Chanda':'ماہانہ چندہ','Zakat':'زکوٰۃ','Sadaqah':'صدقہ','Fitra':'فطرہ','General Donation':'عام عطیہ','Donation':'عطیہ'};
function clsLbl(c){ return lang==='ur' ? (CLS_UR[c]||c) : c; }
function catLbl(c){ return lang==='ur' ? (CAT_UR[c]||c) : c; }
function nmOf(o){ return (lang==='ur' && o.name_ur) ? o.name_ur : (o.name||''); }
function gdOf(o){ return (lang==='ur' && o.guardian_ur) ? o.guardian_ur : (o.guardian||''); }
function prayerLbl(n){ return lang==='ur' ? (PRAYER_UR[String(n).trim()]||n) : n; }
function timeUr(tm){
  if(lang!=='ur') return tm;
  const m=String(tm).match(/^\s*(\d{1,2}):(\d{2})\s*(AM|PM)\b(.*)$/i); if(!m) return tm;
  const h=Number(m[1]); const h24 = m[3].toUpperCase()==='PM' ? (h%12)+12 : (h%12);
  const part = h24<4 ? 'رات' : h24<12 ? 'صبح' : h24<16 ? 'دوپہر' : h24<19 ? 'شام' : 'رات';
  return `${h}:${m[2]} ${part}${m[4]||''}`;
}
function rsLbl(n){ const x=Number(n).toLocaleString(); return lang==='ur' ? `${x} ${t().rupees}` : `Rs ${x}`; }
function notifLbl(msg){
  if(lang!=='ur') return msg; let m;
  if((m=msg.match(/^New admission application from (.+) for (.+)\.$/))) return `${m[1]} کی طرف سے ${clsLbl(m[2])} کے لیے نئی داخلہ درخواست۔`;
  if((m=msg.match(/^Receipt #(\d+) issued to (.+) for Rs (.+)\.$/))) return `رسید نمبر ${m[1]}: ${m[2]} کو ${m[3]} روپے کی رسید جاری ہوئی۔`;
  return msg;
}
function fmtDateTime(x){
  try{
    if(!x || isNaN(new Date(x))) return '';
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Karachi',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:false}).formatToParts(new Date(x)).map(o=>[o.type,o.value]));
    const h24 = Number(p.hour)%24, h12 = h24%12===0 ? 12 : h24%12;
    const part = lang==='ur' ? (h24<4 ? 'رات' : h24<12 ? 'صبح' : h24<16 ? 'دوپہر' : h24<19 ? 'شام' : 'رات') : (h24<12 ? 'AM' : 'PM');
    return `${p.day}/${p.month}/${p.year} ${h12}:${p.minute} ${part}`;
  }catch(e){ return String(x); }
}

const isBlank = v => v==null || String(v).trim()==='';

}

function bindLeaveEvents(){
  const f=el('lvForm'); if(!f) return;
  f.onsubmit=async e=>{ e.preventDefault(); const q=el('lvCode').value.trim(); leaveCode=q;

function wordDownload(filename, title, bodyHTML, landscape){
  const u=lang==='ur';
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(title)}</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page Section1{size:${landscape?'841.9pt 595.3pt':'595.3pt 841.9pt'};mso-page-orientation:${landscape?'landscape':'portrait'};margin:28pt 28pt 28pt 28pt}div.Section1{page:Section1}body{font-family:Arial,"Noto Naskh Arabic","Jameel Noori Nastaleeq",sans-serif}h1{font-size:16pt;text-align:center;margin:0}h2{font-size:12pt;text-align:center;margin:2pt 0 8pt;font-weight:normal}table{border-collapse:collapse;width:100%}td,th{border:1px solid #555;padding:2pt 3pt;font-size:${landscape?'8':'10'}pt;text-align:center}th{background:#e8e8e8}td.l{text-align:left}</style></head><body><div class="Section1" dir="${u?'rtl':'ltr'}"><h1>Jamia Masjid Hudabia · جامع مسجد حدیبیہ</h1><h2>${esc(title)}</h2>${bodyHTML}</div></body></html>`;
  const blob=new Blob(['﻿',html],{type:'application/msword;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename+'.doc'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast(YL().expMade);
}
let expMonth='', expCls='';
function monthDays(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); }
function exportList(){ return students.filter(x=>!expCls||x.cls===expCls).slice().sort((a,b)=>a.cls.localeCompare(b.cls)||a.roll-b.roll); }
function doExport(kind){
  const m=expMonth||todayInPakistan().slice(0,7), list=exportList(), ur=lang==='ur';
  const stLetter={present:'P',late:'L',absent:'A',leave:'Lv'};
  if(kind==='students'){
    const rows=list.map(x=>`<tr><td>${esc(x.roll)}</td><td class="l">${esc(x.name)}${x.name_ur?'<br>'+esc(x.name_ur):''}</td><td class="l">${esc(x.guardian||'')}${x.guardian_ur?'<br>'+esc(x.guardian_ur):''}</td><td>${esc(clsLbl(x.cls))}</td><td>${esc(x.contact||'')}</td></tr>`).join('');
    wordDownload('students-'+todayInPakistan(), (ur?'طلبہ کی فہرست':'Students list')+' — '+todayInPakistan(), `<table><tr><th>${t().rollNo}</th><th>${t().studentName}</th><th>${t().fatherGuardian}</th><th>${t().className}</th><th>${t().contact}</th></tr>${rows}</table>`, false);
  } else if(kind==='grid'){
    const n=monthDays(m), head=Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('');
    const rows=list.map(x=>{ let P=0,L=0,A=0,V=0; const cells=Array.from({length:n},(_,i)=>{ const d=m+'-'+String(i+1).padStart(2,'0'); const v=(attendance[d]||{})[x.id]; if(v==='present')P++; else if(v==='late')L++; else if(v==='absent')A++; else if(v==='leave')V++; return `<td>${v?stLetter[v]:''}</td>`; }).join('');
      return `<tr><td>${esc(x.roll)}</td><td class="l">${esc(nmOf(x))}</td>${cells}<td>${P}</td><td>${L}</td><td>${A}</td><td>${V}</td></tr>`; }).join('');
    wordDownload('attendance-'+m, (ur?'حاضری':'Attendance')+' — '+m+(expCls?' — '+clsLbl(expCls):'')+' (P=Present, L=Late, A=Absent, Lv=Leave)', `<table><tr><th>${t().rollNo}</th><th>${t().studentName}</th>${head}<th>P</th><th>L</th><th>A</th><th>Lv</th></tr>${rows}</table>`, true);
  } else {
    const n=monthDays(m); const days=[]; for(let i=1;i<=n;i++){ const d=m+'-'+String(i).padStart(2,'0'); if(attendance[d] && Object.keys(attendance[d]).length) days.push(d); }
    const rows=list.map(x=>{ let P=0,L=0,A=0,V=0; days.forEach(d=>{ const v=(attendance[d]||{})[x.id]; if(v==='present')P++; else if(v==='late')L++; else if(v==='absent')A++; else if(v==='leave')V++; }); const cnt=P+L+A+V, pct=cnt?Math.round((P+L)*100/cnt):0;
      return `<tr><td>${esc(x.roll)}</td><td class="l">${esc(nmOf(x))}</td><td class="l">${esc(gdOf(x)||'')}</td><td>${esc(clsLbl(x.cls))}</td><td>${P}</td><td>${L}</td><td>${A}</td><td>${V}</td><td>${cnt}</td><td><b>${pct}%</b></td></tr>`; }).join('');
    wordDownload('monthly-report-'+m, (ur?'ماہانہ حاضری رپورٹ':'Monthly attendance report')+' — '+m+(expCls?' — '+clsLbl(expCls):''), `<table><tr><th>${t().rollNo}</th><th>${t().studentName}</th><th>${t().fatherGuardian}</th><th>${t().className}</th><th>${t().present}</th><th>${t().late}</th><th>${t().absent}</th><th>${t().leave}</th><th>${ur?'کل دن':'Days'}</th><th>%</th></tr>${rows}</table>`, false);
  }
}
function renderExportPage(){

function bindExportEvents(){
  const m=el('expMonth'); if(m) m.onchange=()=>{ expMonth=m.value; }; const c=el('expCls'); if(c) c.onchange=()=>{ expCls=c.value; };

let scanLog = {}, scanLogDate = '';
const scanState = {on:false, stream:null, timer:0, facing:'environment', last:{tok:'',t:0}, busy:false, result:null, det:null, canvas:null, flash:'', actx:null};
function fmtT(ts){ try{ return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Asia/Karachi'}); }catch(e){ return ''; } }
function scanChips(x){ return (x.in?`${t().inL} ${fmtT(x.in)}`:'') + (x.in&&x.out?' · ':'') + (x.out?`${t().outL} ${fmtT(x.out)}`:''); }
async function loadScanLog(d){
  try{
    const useD = (userRole==='admin' && d) ? d : todayInPakistan();
    const {data, error} = await sb.rpc('get_scan_log', {p_username:adminUser, p_password:adminPass, p_date:useD}); scanLogDate = useD;
    if(error) throw error;
    scanLog = {}; (data||[]).forEach(r=>{ const o = scanLog[r.student_id] || (scanLog[r.student_id]={in:null,out:null,last:null}); if(r.kind==='in' && !o.in) o.in=r.at; if(r.kind==='out') o.out=r.at; o.last=r.at; });
    if(page==='attendance') render(); else if(page==='scan' && useD===todayInPakistan()) refreshScanLists();
  }catch(e){ console.error('scanlog', e); }
}
function beep(kind){
  try{
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return; if(!scanState.actx) scanState.actx = new A(); const c = scanState.actx;
    const tone=(f,t0,d)=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; o.type='sine'; g.gain.value=0.25; o.connect(g); g.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+d); };
    if(kind==='in') tone(880,0,0.16); else if(kind==='out'){ tone(520,0,0.14); tone(520,0.2,0.14); } else tone(180,0,0.35);
    if(navigator.vibrate) navigator.vibrate(kind==='bad'?[200,80,200]:80);
  }catch(e){}
}

function refreshScanLists(){ const a=el('scanResult'), b=el('scanList'); if(a) a.innerHTML = scanResultHTML(); if(b) b.innerHTML = scanListHTML(); }
function loadJsQR(){
  return new Promise((res,rej)=>{ if(window.jsQR) return res(); const sc=document.createElement('script'); sc.src='vendor-jsqr.js'; sc.onload=()=>res(); sc.onerror=()=>rej(new Error('jsqr')); document.head.appendChild(sc); });
}
async function startScan(){
  if(scanState.on) return;
  try{
    if(scanState.actx && scanState.actx.state==='suspended') scanState.actx.resume();
    if(!scanState.actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) scanState.actx=new A(); }
    if('BarcodeDetector' in window){ try{ scanState.det = new BarcodeDetector({formats:['qr_code']}); }catch(e){ scanState.det=null; } }
    if(!scanState.det) await loadJsQR();
    scanState.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:scanState.facing}, width:{ideal:1280}, height:{ideal:960}}, audio:false});
    scanState.on = true; scanState.flash='';
    attachVideo(); scanTick();
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
    const b=el('scanToggle'); if(b) b.textContent=t().scanStop;
  }catch(e){ scanState.on=false; scanState.result=null; scanState.flash=t().scanCamErr; refreshScanLists(); }
}
function stopScan(){
  scanState.on=false; if(scanState.timer){ clearTimeout(scanState.timer); scanState.timer=0; }
  if(scanState.stream){ scanState.stream.getTracks().forEach(tr=>tr.stop()); scanState.stream=null; }
}
function attachVideo(){ const v=el('scanVideo'); if(v && scanState.stream){ v.srcObject=scanState.stream; const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{}); } }
async function scanTick(){
  if(!scanState.on) return;
  try{
    const v = el('scanVideo');
    if(v && v.readyState>=2 && !scanState.busy){
      let text = null;
      if(scanState.det){ const r = await scanState.det.detect(v); if(r && r.length) text = r[0].rawValue; }
      else if(window.jsQR){
        const w = 480, h = Math.round(w*v.videoHeight/v.videoWidth) || 640;
        const c = scanState.canvas || (scanState.canvas=document.createElement('canvas')); c.width=w; c.height=h;
        const x = c.getContext('2d',{willReadFrequently:true}); x.drawImage(v,0,0,w,h);
        const q = window.jsQR(x.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'dontInvert'}); if(q) text = q.data;
      }
      if(text) onCode(String(text));
    }
  }catch(e){}
  if(scanState.on) scanState.timer = setTimeout(scanTick, 140);
}
function onCode(text){
  const m = /^HUDS:([0-9a-f]{16})$/.exec(text.trim());
  const now = Date.now();
  if(!m){ if(now - scanState.last.t > 3000){ scanState.last = {tok:'?', t:now}; scanState.result={error:t().scanBadQr}; beep('bad'); refreshScanLists(); } return; }
  if(m[1]===scanState.last.tok && now - scanState.last.t < 4000) return;
  scanState.last = {tok:m[1], t:now}; doScan(m[1]);
}
async function doScan(tok){
  scanState.busy = true;
  try{
    const {data, error} = await sb.rpc('scan_student', {p_username:adminUser, p_password:adminPass, p_token:tok});
    if(error) throw error;
    const r = Array.isArray(data) ? data[0] : data; if(!r) throw new Error('empty');
    scanState.result = r;
    if(r.result==='in' || r.result==='out'){
      const o = scanLog[r.student_id] || (scanLog[r.student_id]={in:null,out:null,last:null});
      if(r.result==='in'){ if(!o.in) o.in=r.at; const d=todayInPakistan(); if(!attendance[d]) attendance[d]={}; attendance[d][r.student_id]=r.status||'present'; } else o.out=r.at; o.last=r.at;
      beep(r.result);
    } else beep(r.result==='duplicate' ? 'in' : 'bad');
  }catch(e){
    const m = String((e&&e.message)||e);
    scanState.result = {error: m.includes('invalid_qr') ? t().scanBadQr : (m.includes('forbidden') ? t().scanDenied : t().scanErr)}; beep('bad');
  }
  scanState.busy = false; refreshScanLists();
}
function bindScanEvents(){
  attachVideo(); if(userRole==='admin'){ if(!attCfg) loadAttSettings(); bindCfg(); }
  const tg = el('scanToggle'); if(tg) tg.onclick = ()=>{ if(scanState.on){ stopScan(); tg.textContent=t().scanStart; } else startScan(); };
  const fl = el('scanFlip'); if(fl) fl.onclick = ()=>{ scanState.facing = scanState.facing==='environment' ? 'user' : 'environment'; const was=scanState.on; stopScan(); if(was) startScan(); };
}

let cardData = null, cardCls = '', cardErr = '';
async function loadCards(){
  try{ const {data,error} = await sb.rpc('get_qr_tokens', {p_username:adminUser, p_password:adminPass}); if(error) throw error; cardData = data||[]; cardErr=''; }
  catch(e){ cardData=null; cardErr=t().cardsErr; }
  if(page==='cards') render();
}
function renderCards(){
  if(!(adminOK && userRole==='admin')) return renderAdminLogin();
  if(cardData===null && !cardErr){ loadCards(); }
  const list = (cardData||[]).filter(c=>!cardCls || c.cls===cardCls);
  const classes = [...new Set((cardData||[]).map(c=>c.cls))];
  const cards = list.map(c=>{
    const st = {id:c.student_id, name:c.name, name_ur:c.name_ur, roll:c.roll, cls:c.cls};
    const full = students.find(x=>x.id===c.student_id); const gd = full ? gdOf(full) : '';
    const ph = c.photo ? `<img class="cp" src="${c.photo}" alt="">` : `<div class="cp">${esc(Array.from(nmOf(st)||'?')[0]||'?')}</div>`;
    return `<div class="cardwrap"><div class="idcard"><div class="hd"><img class="e" src="${CARD_EMB}" alt=""><img class="u" src="${CARD_URDU}" alt=""></div><div class="band">JAMIA MASJID HUDABIA</div>${ph}<div class="cn">${esc(nmOf(st))}</div>${gd?`<div class="gd">${lang==='ur'?'ولد':'S/O'} ${esc(gd)}</div>`:''}<div class="cm">${esc(clsLbl(c.cls))} · ID ${esc(c.roll)}</div><div class="cq" data-qr="HUDS:${esc(c.token)}"></div><div class="ft"><div>jamiahudabia.github.io</div><div>03225600912</div></div></div><button class="btn secondary small regen" data-sid="${esc(c.student_id)}">${t().cardsRegen}</button></div>`;
  }).join('');
  return `<div class="noprint"><h2 class="page-title">${t().cardsTitle}</h2><p class="page-sub">${t().cardsHelp}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;"><button class="btn secondary" id="cardsBack" style="margin:0;">${t().cardsBack}</button><select id="cardsCls" style="max-width:200px;"><option value="">${t().cardsClass}: ${t().cardsAll}</option>${classes.map(c=>`<option value="${esc(c)}" ${c===cardCls?'selected':''}>${esc(clsLbl(c))}</option>`).join('')}</select><button class="btn" id="cardsPrint" style="margin:0;">${t().cardsPrint} (${list.length})</button></div>${cardErr?`<div class="card" style="color:var(--bad);">${esc(cardErr)}</div>`:''}${(cardData===null&&!cardErr)?`<div class="card">${t().cardsLoading}</div>`:''}</div><div class="cardsgrid">${cards}</div>`;
}
function bindCardsEvents(){
  document.body.classList.add('printcards');
  document.querySelectorAll('[data-qr]').forEach(b=>{ b.innerHTML=''; if(window.QRCode) new QRCode(b,{text:b.dataset.qr,width:140,height:140,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); });
  const bk=el('cardsBack'); if(bk) bk.onclick=()=>{ page='madrissa'; render(); renderNav(); };
  const cs=el('cardsCls'); if(cs) cs.onchange=()=>{ cardCls=cs.value; render(); };
  const pr=el('cardsPrint'); if(pr) pr.onclick=()=>window.print();
  document.querySelectorAll('.regen').forEach(b=> b.onclick=async ()=>{
    if(!confirm(t().cardsRegenAsk)) return;
    try{ const {error}=await sb.rpc('regenerate_qr_token',{p_username:adminUser,p_password:adminPass,p_student_id:b.dataset.sid}); if(error) throw error; await loadCards(); }catch(e){ showDebugError(e.message||String(e)); }
  });
}

  f.querySelectorAll('[data-fp]').forEach(a=> a.onclick=e=>{ e.preventDefault(); page=a.dataset.fp; render(); renderNav(); window.scrollTo(0,0); });
  { const nl=f.querySelector('#notifyLink'); if(nl) nl.onclick=e=>{ e.preventDefault(); openNotify(); }; }
}
const PH_RE = /(?:\+92|0092|92|0)3\d{2}[- ]?\d{7}/g, MAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
function linkifyContacts(root){
  if(!root) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement; if(!p||p.closest('a,button,input,textarea,select,option,script,style,.slip,#receiptSheet,.idcard')) return NodeFilter.FILTER_REJECT; return (/\d{9}|@/.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }}); const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);

    while((m=re.exec(txt))){ if(!out) out=document.createDocumentFragment(); out.appendChild(document.createTextNode(txt.slice(last,m.index))); const a=document.createElement('a'); const v=m[0];

function fileToJpeg(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      try{
        const max = 260; let w = img.naturalWidth, h = img.naturalHeight; if(!w||!h) throw new Error('size');
        const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k);
        const c = document.createElement('canvas'); c.width=w; c.height=h; const x = c.getContext('2d');
        x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        let q = 0.8, out = c.toDataURL('image/jpeg', q);
        while(out.length > 70000 && q > 0.3){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url);
        if(out.length >= 79000) reject(new Error('big')); else resolve(out);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

function renderMonthlyAttendance(){
  const allMonths = [...new Set(Object.keys(attendance).map(d=>d.slice(0,7)))].sort().reverse();
  const curMonth = selectedReportMonth || allMonths[0] || todayInPakistan().slice(0,7);

  const rows = students.map(s=>{
    let present=0, absent=0, leave=0;
    Object.keys(attendance).forEach(d=>{
      if(d.slice(0,7)===curMonth && attendance[d][s.id]){
        const v=attendance[d][s.id];
        if(v==='present'||v==='late') present++; else if(v==='leave') leave++; else absent++;
      }
    });
    const totalD = present+absent;
    const pct = totalD ? Math.round(present/totalD*100) : 0;
    return `<tr><td class="roll">#${esc(s.roll)}</td><td>${esc(nmOf(s))}${gdOf(s)?`<span class="guard">${t().fatherGuardian}: ${esc(gdOf(s))}</span>`:''}</td><td>${present}</td><td>${absent}</td><td>${leave}</td><td>${pct}%</td></tr>`;
  }).join('');
  return `

function collectReportRows(){
  const rows = [];
  document.querySelectorAll('#drGrid tbody tr').forEach(tr=>{
    const sid = tr.dataset.row; const o = {student_id:sid};
    tr.querySelectorAll('[data-f]').forEach(inp=>{
      const f = inp.dataset.f; const v = inp.value;
      o[f] = String(v).trim();
    });
    rows.push(o);
  });
  return rows;
}

function buildParentMessage(s, row, date){
  const L = DR_L.ur;   // parents get the message in Urdu
  const line = (label, d, who, m, a)=>{
    if(!d && !who && isBlank(m) && isBlank(a)) return '';
    const nums = [isBlank(m)?'':`${L.mistakes} ${m}`, isBlank(a)?'':`${L.atkan} ${a}`].filter(Boolean).join('، ');
    return `${label}: ${d||'—'}${who?` (${L.listener}: ${who})`:''}${nums?` — ${nums}`:''}`;
  };
  const digits = String(s.contact||'').replace(/\D/g,'');
  const link = s.token ? `${location.origin}/#r-${s.token}` : `${location.origin}/#check-${s.roll}-${digits.slice(-3)}`;
  const lines = [
    L.msgHello,
    `${s.name_ur||s.name} (${CLS_UR[s.cls]||s.cls}) ${L.msgReportOf} — ${date}`,
    line(L.sabaq, row.sabaq_detail, row.sabaq_listener, row.sabaq_mistakes, row.sabaq_atkan),
    line(L.sabqi, row.sabqi_detail, row.sabqi_listener, row.sabqi_mistakes, row.sabqi_atkan),
    line(L.manzil, row.manzil_detail, row.manzil_listener, row.manzil_mistakes, row.manzil_atkan),
    (row.time1||row.time2||row.uniform) ? `${L.attendance}: ${L.time1} ${row.time1?L[row.time1]:'—'}، ${L.time2} ${row.time2?L[row.time2]:'—'} | ${L.uniform}: ${row.uniform?L[row.uniform]:'—'}` : '',
    row.note ? `${L.note}: ${row.note}` : '',
    'جامعہ حدیبیہ تعلیم القرآن',
    `${L.msgView}: ${link}`,
    L.msgPrivate
  ];
  return lines.filter(x=> x!=='').join('\n');
}

// ---- checks that catch mistakes before a report is shared
const hasLesson = r => !!(r.sabaq_detail || r.sabqi_detail || r.manzil_detail);
const fullDay = r => ['present','late'].includes(r.time1) && ['present','late'].includes(r.time2);
const testWord = r => [r.sabaq_detail,r.sabqi_detail,r.manzil_detail,r.sabaq_listener,r.sabqi_listener,r.manzil_listener,r.note].some(v=>/\btest\b/i.test(v||''));
function reportWarnings(rows){
  const L = DR(); const out = []; const byId = new Map(students.map(x=>[x.id,x]));
  const classHas = {};   // a class where nobody entered lessons (e.g. Nazira) is not flagged
  rows.forEach(r=>{ const st = byId.get(r.student_id); if(st && hasLesson(r)) classHas[st.cls] = true; });
  const names = list => list.slice(0,8).join('، ') + (list.length>8 ? ' …' : '');
  const missing = rows.filter(r=>{ const st=byId.get(r.student_id); return st && classHas[st.cls] && fullDay(r) && !hasLesson(r); }).map(r=>nmOf(byId.get(r.student_id)));
  if(missing.length) out.push(L.warnNoLesson.replace('{n}', missing.length) + ': ' + names(missing));
  const big = [];
  rows.forEach(r=>{ const st=byId.get(r.student_id); if(!st) return;
    ['sabaq','sabqi','manzil'].forEach(k=>['mistakes','atkan'].forEach(f=>{ const v=r[k+'_'+f]; if(/^\d+$/.test(String(v==null?'':v).trim()) && Number(v)>50) big.push(`${nmOf(st)} (${L[k]} ${L[f]} ${v})`); })); });
  if(big.length) out.push(L.warnBig + ': ' + names(big));
  const tests = rows.filter(testWord).map(r=>nmOf(byId.get(r.student_id)||{})).filter(Boolean);
  if(tests.length) out.push(L.warnTest + ': ' + names(tests));
  return out;
}

function bindReportEvents(){
  const drDate = el('drDate'), drClass = el('drClass'), drTeacher = el('drTeacher'), save = el('drSaveBtn');
  if(drDate) drDate.onchange = ()=>{ if(!drDate.value) return; reportDate = drDate.value; reportMsg = {text:'',cls:''}; reportWarn = []; render(); };
  if(drClass) drClass.onchange = ()=>{ reportClass = drClass.value; reportMsg = {text:'',cls:''}; reportWarn = []; render(); };
  if(drTeacher) drTeacher.oninput = ()=>{ reportTeacher = drTeacher.value; lsSet('hud_teacher', drTeacher.value); };
  if(save) save.onclick = async ()=>{
    const L = DR(); const date = reportDate || todayInPakistan(); const msg = el('drMsg');
    save.disabled = true; msg.className='dr-msg'; msg.textContent = L.saving;
    try{
      const rows = collectReportRows();
      const warns = reportWarnings(rows);
      const {data, error} = await sb.rpc('save_daily_reports', {p_username:adminUser, p_password:adminPass, p_date:date, p_teacher:(el('drTeacher').value||'').trim(), p_rows:rows});
      if(error) throw error; okToast('reports');
      reportsLoadedKey = null;   // reload from the database
      reportMsg = {text:L.saved.replace('{n}', data), cls:'ok'}; reportWarn = warns;
      await loadReports(date);
    }catch(e){
      const m = String((e && e.message) || e);
      msg.className = 'dr-msg err'; msg.textContent = L.failed;
      if(!/invalid_input|invalid_date/.test(m)) showDebugError(m);
      save.disabled = false;
    }
  };
  document.querySelectorAll('.drWa').forEach(b=>{
    const s = students.find(x=>x.id===b.dataset.sid); if(!s) return;
    const digits = String(s.contact||'').replace(/\D/g,'');
    if(digits.length < 10){ b.disabled = true; b.textContent = DR().noNumber; return; }
    b.onclick = ()=>{
      const tr = b.closest('tr'); const row = {};
      tr.querySelectorAll('[data-f]').forEach(inp=>{ const f=inp.dataset.f; row[f] = String(inp.value).trim(); });
      const date = reportDate || todayInPakistan();
      const L2 = DR(); const all = collectReportRows();
      const classHasLessons = all.some(r=>{ const st=students.find(x=>x.id===r.student_id); return st && st.cls===s.cls && hasLesson(r); });
      if(classHasLessons && fullDay(row) && !hasLesson(row) && !confirm(L2.confirmNoLesson.replace('{name}', nmOf(s)))) return;
      if(testWord(row) && !confirm(L2.confirmTest.replace('{name}', nmOf(s)))) return;
      let num = digits; if(num.length===11 && num[0]==='0') num = '92'+num.slice(1);
      window.open('https://wa.me/'+num+'?text='+encodeURIComponent(buildParentMessage(s,row,date)), '_blank', 'noopener');
      b.classList.add('sent'); b.textContent = DR().sent;
    };
  });
}

const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_UR=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
function fmtMonth(m){ const y=m.slice(0,4), mm=Number(m.slice(5,7)); return (lang==='ur'?MONTHS_UR:MONTHS_EN)[mm-1]+' '+y; }
function monthRangeList(first,last){
  const out=[]; let y=Number(first.slice(0,4)), m=Number(first.slice(5,7));
  const ly=Number(last.slice(0,4)), lm=Number(last.slice(5,7));
  while((y<ly || (y===ly && m<=lm)) && out.length<240){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){ m=1; y++; } }
  return out;
}

async function doMycontribSearch(code){
  if(!code) return;
  try{
    const {data, error} = await sb.rpc('get_donor_contributions_v2', {p_code:code});
    if(error) throw error;
    if(!data || !data.length){ mycontribResult = 'notfound'; render(); return; }
    const total = data.reduce((s,r)=>s+Number(r.amount),0);
    const paid = [...new Set(data.filter(r=>r.for_month).map(r=>r.for_month))].sort();
    let missing = [];
    if(paid.length){
      const nowM = todayInPakistan().slice(0,7);
      const lastM = paid[paid.length-1] > nowM ? paid[paid.length-1] : nowM;
      missing = monthRangeList(paid[0], lastM).filter(m=>!paid.includes(m));
    }
    mycontribResult = {data, total, paid, missing};
    render();
  }catch(e){
    if(String((e && e.message) || e).includes('locked')){ mycontribResult = 'locked'; render(); }
    else showDebugError(e.message || String(e));
  }
}

      if(String((e && e.message) || e).includes('locked')){ box.innerHTML = `<div class="card"><div class="empty">${t().lockedMsg}</div></div>`; }

      if(adminSetupNeeded){
        const {data, error} = await sb.rpc('claim_admin', {p_username:u, p_password:p});

        return;

    e.preventDefault();
