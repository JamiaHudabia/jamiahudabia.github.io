<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hudabia & The Islamic School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --teal-950:#0B2622; --teal-900:#0E332C; --teal-800:#154A40; --teal-700:#1C5C4F; --teal-600:#276F5F;
    --gold:#C9A24B; --gold-light:#E7CD8A; --gold-soft:#F3E7C8;
    --bg:#F6F4EC; --card:#FFFFFF;
    --ink:#1E2620; --muted:#66756A; --line:#E4DFCE;
    --ok:#3F7A56; --ok-bg:#E5F1E8; --bad:#B14A3B; --bad-bg:#F7E7E3;
    --radius:16px; --shadow:0 4px 18px rgba(14,51,44,.07), 0 1px 3px rgba(14,51,44,.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Amiri',serif;}
  [dir="rtl"]{font-family:'Noto Nastaliq Urdu','Work Sans',sans-serif;}
  [dir="rtl"] .stat-row,[dir="rtl"] .grid2,[dir="rtl"] .grid3,[dir="rtl"] .card-grid{direction:rtl;}
  [dir="rtl"] table th, [dir="rtl"] table td{text-align:right;}
  a{color:inherit;}

  /* ===== Top navbar ===== */
  .topnav{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--teal-900),var(--teal-800));color:#F2F6EE;box-shadow:0 2px 14px rgba(0,0,0,.12);}
  .topnav-inner{max-width:1240px;margin:0 auto;padding:0 22px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .arch{width:30px;height:30px;flex-shrink:0;}
  .brand-text{line-height:1.15;}
  .brand-text .b1{font-size:15px;font-weight:700;color:var(--gold-light);font-family:'Amiri',serif;}
  .brand-text .b2{font-size:10.5px;color:rgba(242,246,238,.65);}
  nav.mainnav{display:flex;align-items:center;gap:4px;}
  nav.mainnav button{all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:14px;color:rgba(242,246,238,.82);}
  nav.mainnav button:hover{background:rgba(255,255,255,.08);}
  nav.mainnav button.active{background:rgba(255,255,255,.12);color:var(--gold-light);font-weight:600;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .lang-toggle{display:flex;border:1.5px solid rgba(242,246,238,.35);border-radius:24px;overflow:hidden;}
  .lang-toggle button{all:unset;cursor:pointer;padding:6px 14px;font-size:12.5px;font-weight:600;color:rgba(242,246,238,.85);}
  .lang-toggle button.on{background:var(--gold);color:var(--teal-950);}
  .hamburger{display:none;all:unset;cursor:pointer;padding:8px;color:#F2F6EE;}
  .mobile-drawer{display:none;position:fixed;inset:0;z-index:40;background:rgba(11,38,34,.55);}
  .mobile-drawer .panel{background:var(--teal-900);width:78%;max-width:300px;height:100%;padding:24px 18px;display:flex;flex-direction:column;gap:6px;}
  .mobile-drawer button.navitem{all:unset;cursor:pointer;padding:12px 14px;border-radius:10px;color:#F2F6EE;font-size:15px;}
  .mobile-drawer button.navitem.active{background:rgba(255,255,255,.1);color:var(--gold-light);}
  .bell-wrap{position:relative;}
  .bell-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(242,246,238,.35);display:flex;align-items:center;justify-content:center;color:#F2F6EE;position:relative;}
  .bell-btn svg{width:16px;height:16px;}
  .bell-dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:#E4604F;}
  .bell-panel{position:absolute;top:44px;right:0;width:320px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20;max-height:380px;overflow-y:auto;}
  [dir="rtl"] .bell-panel{right:auto;left:0;}
  .bell-panel .bn-item{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;}
  .bell-panel .bn-item .bn-time{color:var(--muted);font-size:11px;margin-top:3px;}
  .bell-panel .bn-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}
  .bell-panel .bn-head{padding:12px 16px;font-weight:700;color:var(--teal-900);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
  .bell-panel .bn-head button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);}

  main{max-width:1240px;margin:0 auto;padding:32px 22px 70px;}
  .page-title{font-size:30px;margin:0 0 6px;color:var(--teal-900);}
  .page-sub{color:var(--muted);margin:0 0 26px;font-size:14.5px;}

  /* ===== Hero ===== */
  .hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:30px;min-height:300px;display:flex;align-items:flex-end;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,38,34,.15) 0%,rgba(11,38,34,.55) 55%,rgba(11,38,34,.92) 100%);}
  .hero-content{position:relative;z-index:1;padding:36px 34px 30px;color:#fff;}
  .hero-content .eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);font-weight:700;margin-bottom:8px;}
  .hero-content h1{font-size:clamp(28px,4vw,42px);margin:0 0 8px;color:#fff;}
  .hero-content p{margin:0;font-size:15px;color:rgba(255,255,255,.85);max-width:560px;}

  /* ===== Cards & grids ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;box-shadow:var(--shadow);}
  .card h3{margin:0 0 16px;font-size:17px;color:var(--teal-900);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr;} }

  .prayer-card{background:linear-gradient(160deg,var(--teal-900),var(--teal-800));color:#F2F6EE;border-radius:14px;padding:16px;text-align:center;}
  .prayer-card .pname{font-size:12.5px;color:var(--gold-light);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .prayer-card .ptime{font-family:'Amiri',serif;font-size:22px;margin-top:6px;}
  .prayer-card .pedit{all:unset;cursor:pointer;font-size:11px;color:rgba(242,246,238,.55);margin-top:6px;display:block;}

  .announce-card{background:var(--gold-soft);border:1px solid var(--gold-light);border-radius:12px;padding:14px 16px;position:relative;}
  .announce-card .ann-text{font-size:14px;color:var(--teal-900);}
  .announce-card .ann-del{all:unset;cursor:pointer;position:absolute;top:10px;right:12px;color:var(--muted);font-size:11px;}
  [dir="rtl"] .announce-card .ann-del{right:auto;left:12px;}

  .class-chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;font-weight:600;color:var(--teal-900);box-shadow:var(--shadow);position:relative;}
  .class-chip .cls-del{all:unset;cursor:pointer;position:absolute;top:8px;right:10px;color:var(--muted);font-size:11px;}
  [dir="rtl"] .class-chip .cls-del{right:auto;left:10px;}

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;margin-top:12px;font-weight:600;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);outline-offset:1px;border-color:var(--gold);}
  textarea{resize:vertical;min-height:60px;}
  .btn{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--teal-800),var(--teal-900));color:var(--gold-light);padding:11px 22px;border-radius:10px;font-size:14px;font-weight:700;display:inline-block;margin-top:16px;box-shadow:0 3px 10px rgba(14,51,44,.25);}
  .btn:hover{filter:brightness(1.12);}
  .btn.small{padding:7px 14px;font-size:12.5px;margin:0;box-shadow:none;}
  .btn.secondary{background:transparent;color:var(--teal-900);border:1px solid var(--line);box-shadow:none;}
  .btn.danger{background:var(--bad);color:#fff;box-shadow:none;}

  .section-heading{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .section-heading:first-child{margin-top:0;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .pill.income,.pill.present{background:var(--ok-bg);color:var(--ok);}
  .pill.expense,.pill.absent{background:var(--bad-bg);color:var(--bad);}

  .stat-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .stat{flex:1;min-width:170px;background:linear-gradient(150deg,var(--teal-900),var(--teal-700));color:#F2F6EE;border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .stat .icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .stat .icon svg{width:17px;height:17px;color:var(--gold-light);}
  .stat .num{font-size:24px;font-family:'Amiri',serif;color:var(--gold-light);}
  .stat .lbl{font-size:12px;color:rgba(242,246,238,.72);margin-top:2px;}

  .lock{text-align:center;padding:44px 20px;max-width:380px;margin:0 auto;}
  .lock .lock-icon{width:52px;height:52px;border-radius:50%;background:var(--teal-900);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .lock .lock-icon svg{width:22px;height:22px;color:var(--gold-light);}
  .empty{color:var(--muted);font-size:13.5px;font-style:italic;padding:14px 0;text-align:center;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;}
  .list-item:last-child{border-bottom:none;}
  .row-actions button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-inline-start:12px;}
  .row-actions button:hover{color:var(--bad);}
  .edit-badge{background:var(--gold-light);color:var(--teal-900);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .roll{font-family:'Amiri',serif;color:var(--gold);font-weight:700;}
  .search-hero{background:linear-gradient(160deg,var(--teal-900),var(--teal-700));border-radius:20px;padding:40px 30px;text-align:center;color:#fff;margin-bottom:26px;}
  .search-hero h2{color:#fff;margin:0 0 8px;}
  .search-hero p{color:rgba(255,255,255,.75);margin:0 0 20px;font-size:14px;}
  .search-box{display:flex;gap:10px;max-width:480px;margin:0 auto;}
  .search-box input{flex:1;border:none;padding:13px 16px;border-radius:10px;}
  .avatar-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--teal-950);font-family:'Amiri',serif;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .progress-bar{background:var(--line);border-radius:20px;height:9px;overflow:hidden;margin-top:8px;}
  .progress-bar > div{background:linear-gradient(90deg,var(--ok),#5fae7d);height:100%;}
  .doc-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .doc-list li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--teal-900);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .doc-list li svg{width:16px;height:16px;color:var(--ok);flex-shrink:0;}
  #debugBanner{display:none;background:#F7E7E3;border:1px solid var(--bad);color:#7A2E22;padding:12px 16px;border-radius:10px;font-size:12.5px;margin-bottom:18px;white-space:pre-wrap;}
  footer.sitefoot{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 22px 40px;}

  @media (max-width:860px){
    nav.mainnav{display:none;}
    .hamburger{display:block;}
    .brand-text .b2{display:none;}
  }
  @media (max-width:640px){
    main{padding:20px 14px 50px;}
    .hero-content{padding:24px 20px 22px;}
    .card{padding:18px 18px;}
    .stat-row{flex-direction:column;}
  }
</style>
</head>

function showDebugError(msg){
  const b = el('debugBanner');
  b.textContent = 'Error details (please copy this to Claude): ' + msg;
  b.style.display = 'block';
}

async function loadAll(){
  renderNav(); render(); renderBell();
  try{
    const {data} = await sb.rpc('get_site_content');
    if(data){ content = {prayerTimes:data.prayer_times, announcements:data.announcements, classes:data.classes, prayerDate:data.prayer_date}; }
  }catch(e){ console.error('site_content load failed', e); }
  try{
    const {data} = await sb.rpc('admin_exists');
    adminSetupNeeded = !data;
  }catch(e){ console.error('admin_exists check failed', e); }
  renderNav(); render(); renderBell();
  syncPrayerTimesIfNeeded();
}

function todayInPakistan(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Karachi'});
}
function to12Hour(hhmm){
  const clean = hhmm.split(' ')[0]; // strip any "(PKT)" style suffix
  const [h,m] = clean.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = h%12===0 ? 12 : h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
async function syncPrayerTimesIfNeeded(){
  const today = todayInPakistan();
  if(content.prayerDate === today) return; // already synced for today
  try{
    const [dd,mm,yyyy] = [today.slice(8,10), today.slice(5,7), today.slice(0,4)];
    const url = `https://api.aladhan.com/v1/timingsByCity/${dd}-${mm}-${yyyy}?city=Gujranwala&country=Pakistan&method=1&school=1`;
    const res = await fetch(url);
    const json = await res.json();
    const tm = json.data.timings;
    const newTimes = [
      {name:'Fajr', time:to12Hour(tm.Fajr)},
      {name:'Dhuhr', time:to12Hour(tm.Dhuhr)},
      {name:'Asr', time:to12Hour(tm.Asr)},
      {name:'Maghrib', time:to12Hour(tm.Maghrib)},
      {name:'Isha', time:to12Hour(tm.Isha)},
    ];
    const autoNames = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
    const manualEntries = (content.prayerTimes||[]).filter(p => !autoNames.includes(p.name));
    newTimes.push(...manualEntries);
    const {data, error} = await sb.rpc('sync_prayer_times', {p_prayer_times:newTimes, p_date:today});
    if(error) throw error;
    if(data){ content.prayerTimes = newTimes; content.prayerDate = today; }
    else { const {data:fresh} = await sb.rpc('get_site_content'); if(fresh){ content.prayerTimes = fresh.prayer_times; content.prayerDate = fresh.prayer_date; } }
    if(page==='home') render();
  }catch(e){ console.error('prayer time auto-sync failed', e); showDebugError('Prayer time auto-sync: ' + (e.message || String(e))); }
}

async function loadAdminData(){
  try{
    const [studRes, admRes, attRes, notifRes] = await Promise.all([
      sb.rpc('get_students', {p_username:adminUser, p_password:adminPass}),
      sb.rpc('get_admissions', {p_username:adminUser, p_password:adminPass}),
      sb.rpc('get_attendance', {p_username:adminUser, p_password:adminPass}),
      sb.rpc('get_notifications', {p_username:adminUser, p_password:adminPass}),
    ]);
    if(studRes.error) throw studRes.error;
    if(admRes.error) throw admRes.error;
    if(attRes.error) throw attRes.error;
    if(notifRes.error) throw notifRes.error;
    students = (studRes.data||[]).map(s=>({id:s.id, roll:s.roll, name:s.name, cls:s.cls, guardian:s.guardian, contact:s.contact}));
    admissions = (admRes.data||[]).map(a=>({id:a.id, admNo:a.adm_no, admDate:a.adm_date, name:a.name, guardian:a.guardian, dob:a.dob, cls:a.cls, studentIdCard:a.student_id_card, fatherIdCard:a.father_id_card, residence:a.residence, contact:a.contact, prevInfo:a.prev_info}));
    attendance = {};
    (attRes.data||[]).forEach(r=>{ if(!attendance[r.date]) attendance[r.date]={}; attendance[r.date][r.student_id]=r.status; });
    notifications = (notifRes.data||[]).map(n=>({id:n.id, msg:n.msg, time:n.created_at, read:n.is_read}));
  }catch(e){ showDebugError(e.message || String(e)); }
}

async function loadFinanceData(){
  try{
    const {data, error} = await sb.rpc('get_finance', {p_username:financeUser, p_password:financePass});
    if(error) throw error;
    finance = (data||[]).map(f=>({id:f.id, type:f.type, category:f.category, amount:f.amount, date:f.date, note:f.note, receiptNo:f.receipt_no}));
  }catch(e){ showDebugError(e.message || String(e)); }
}

async function pushSiteContent(){

  }catch(e){ showDebugError(e.message || String(e)); }
}

function setLang(l){
  lang=l;

  document.body.setAttribute('dir', l==='ur' ? 'rtl' : 'ltr');

function renderNav(){
  const items=[['home',t().nav.home,'home'],['madrissa',t().nav.madrissa,'madrissa'],['check',t().nav.check,'check']];
  el('navList').innerHTML = items.map(([id,label,icon])=>`<button data-p="${id}" class="${page===id?'active':''}">${label}</button>`).join('');
  [...el('navList').children].forEach(b=> b.onclick=()=>{ page=b.dataset.p; render(); renderNav(); });
  el('mobileDrawerPanel').innerHTML = items.map(([id,label])=>`<button data-p="${id}" class="navitem ${page===id?'active':''}">${label}</button>`).join('');
  [...el('mobileDrawerPanel').children].forEach(b=> b.onclick=()=>{ page=b.dataset.p; render(); renderNav(); closeMobile(); });
}
function openMobile(){ mobileOpen=true; el('mobileDrawer').style.display='flex'; }
function closeMobile(){ mobileOpen=false; el('mobileDrawer').style.display='none'; }

let selectedAttDate = null;
function renderAttendanceForm(){
  const today = new Date().toISOString().slice(0,10);
  const curDate = selectedAttDate || today;
  const curAtt = attendance[curDate] || {};
  return `
    <div style="margin-bottom:14px;"><label>${t().attDateLabel}</label><input type="date" id="attDatePicker" value="${curDate}" max="${today}"></div>
    <table><tr><th>${t().rollNo}</th><th>${t().studentName}</th><th>${t().present} / ${t().absent}</th></tr>${students.map(s=>`
    <tr><td class="roll">#${s.roll}</td><td>${s.name}</td><td>
      <label style="display:inline;margin:0;font-weight:400;"><input type="radio" name="att-${s.id}" value="present" ${curAtt[s.id]==='present'?'checked':''} class="attRadio" data-sid="${s.id}" style="width:auto;"> ${t().present}</label>
      &nbsp;&nbsp;
      <label style="display:inline;margin:0;font-weight:400;"><input type="radio" name="att-${s.id}" value="absent" ${curAtt[s.id]==='absent'?'checked':''} class="attRadio" data-sid="${s.id}" style="width:auto;"> ${t().absent}</label>
    </td></tr>`).join('')}</table>`;
}

function renderMonthlyAttendance(){
  const allMonths = [...new Set(Object.keys(attendance).map(d=>d.slice(0,7)))].sort().reverse();
  const curMonth = selectedReportMonth || allMonths[0] || new Date().toISOString().slice(0,7);
  const opts = allMonths.length ? allMonths : [curMonth];
  const rows = students.map(s=>{
    let present=0, absent=0;
    Object.keys(attendance).forEach(d=>{
      if(d.slice(0,7)===curMonth && attendance[d][s.id]){
        if(attendance[d][s.id]==='present') present++; else absent++;
      }
    });
    const totalD = present+absent;
    const pct = totalD ? Math.round(present/totalD*100) : 0;
    return `<tr><td class="roll">#${s.roll}</td><td>${s.name}</td><td>${present}</td><td>${absent}</td><td>${pct}%</td></tr>`;
  }).join('');
  return `
    <label>${t().selectMonth}</label>
    <select id="monthSelect">${opts.map(m=>`<option value="${m}" ${m===curMonth?'selected':''}>${m}</option>`).join('')}</select>
    <table style="margin-top:14px;"><tr><th>${t().rollNo}</th><th>${t().studentName}</th><th>${t().daysPresent}</th><th>${t().daysAbsent}</th><th>${t().attRate}</th></tr>${rows}</table>`;
}

    <table style="width:100%;font-size:15px;">
      <tr><td style="padding:10px 6px;color:var(--muted);width:40%;">سیریل نمبر:</td><td style="padding:10px 6px;border-bottom:1px dotted var(--line);font-weight:700;">${e.receiptNo || '—'}</td></tr>
      <tr><td style="padding:10px 6px;color:var(--muted);">تاریخ:</td><td style="padding:10px 6px;border-bottom:1px dotted var(--line);">${e.date}</td></tr>
      <tr><td style="padding:10px 6px;color:var(--muted);">محترم جناب:</td><td style="padding:10px 6px;border-bottom:1px dotted var(--line);">${e.note || ''}</td></tr>
      <tr><td style="padding:10px 6px;color:var(--muted);">تفصیل:</td><td style="padding:10px 6px;border-bottom:1px dotted var(--line);">${e.category}</td></tr>
      <tr><td style="padding:10px 6px;color:var(--muted);">مبلغ:</td><td style="padding:10px 6px;border-bottom:1px dotted var(--line);font-weight:700;">Rs ${Number(e.amount).toLocaleString()}</td></tr>
      <tr><td colspan="2" style="padding-top:40px;text-align:left;color:var(--muted);">دستخط مہتمم: ______________________</td></tr>
    </table>
  </div>
  <style>@media print{ .topnav,.sitefoot,#debugBanner,.page-title,main > .card:not(#printArea){display:none !important;} #printArea{border:3px double #C9A24B !important;} body{background:#fff;} }</style>`;
}

function renderBell(){
  el('bellWrap').style.display = adminOK ? 'flex' : 'none';
  const unread = notifications.filter(n=>!n.read).length;
  el('bellDot').style.display = unread ? 'block' : 'none';
  const panel = el('bellPanel');
  panel.innerHTML = `<div class="bn-head"><span>${t().notifications}</span><button id="markReadBtn">${t().markAllRead}</button></div>` +
    (notifications.length ? notifications.map(n=>`<div class="bn-item">${n.msg}<div class="bn-time">${new Date(n.time).toLocaleString()}</div></div>`).join('') : `<div class="bn-empty">${t().noNotifications}</div>`);
  const mrb = el('markReadBtn');
  if(mrb) mrb.onclick = async ()=>{
    notifications.forEach(n=>n.read=true); renderBell();
    try{ await sb.rpc('mark_notifications_read', {p_username:adminUser, p_password:adminPass}); }
    catch(e){ showDebugError(e.message || String(e)); }
  };
}

function bindEvents(){
  const admForm = el('admForm');
  if(admForm) admForm.onsubmit = async e=>{
    e.preventDefault();
    const f=new FormData(admForm);
    const name=f.get('name').trim(), guardian=f.get('guardian').trim(), dob=f.get('dob'), cls=f.get('cls'), contact=f.get('contact').trim();
    if(!name||!guardian||!dob||!cls||!contact){ el('admFormErr').textContent = t().fillRequired; return; }
    try{
      const {data, error} = await sb.rpc('submit_admission_v2', {
        p_adm_date: f.get('admDate'), p_name:name, p_guardian:guardian, p_dob:dob, p_cls:cls,
        p_student_id_card: f.get('studentIdCard'), p_father_id_card: f.get('fatherIdCard'), p_residence: f.get('residence'), p_contact:contact, p_prev_info: f.get('prevInfo')
      });
      if(error) throw error;
      el('pageRoot').innerHTML = `<div class="card" style="text-align:center;padding:44px 24px;">
        <div class="lock-icon" style="margin:0 auto 16px;">${svgIcon('check2')}</div>
        <h2 class="page-title" style="text-align:center;">${t().submitted}</h2>
        <p style="color:var(--muted);margin-bottom:6px;">${t().yourAdmNo}</p>
        <div style="font-family:'Amiri',serif;font-size:34px;color:var(--gold);font-weight:700;">#${data}</div>
      </div>`;
    }catch(e){ showDebugError(e.message || String(e)); }
  };

  const addClassForm = el('addClassForm');
  if(addClassForm) addClassForm.onsubmit = async e=>{
    e.preventDefault(); const f=new FormData(addClassForm); const cls=f.get('cls').trim();
    if(!cls){ el('addClassErr').textContent=t().fillRequired; return; }
    content.classes.push(cls); render(); await pushSiteContent();
  };
  document.querySelectorAll('[data-act="delClass"]').forEach(b=> b.onclick = async ()=>{
    content.classes.splice(Number(b.dataset.i),1); render(); await pushSiteContent();
  });

  const addAnnForm = el('addAnnForm');
  if(addAnnForm) addAnnForm.onsubmit = async e=>{
    e.preventDefault(); const f=new FormData(addAnnForm); const ann=f.get('ann').trim();
    if(!ann){ el('addAnnErr').textContent=t().fillRequired; return; }
    content.announcements.push(ann); render(); await pushSiteContent();
  };
  document.querySelectorAll('[data-act="delAnn"]').forEach(b=> b.onclick = async ()=>{
    content.announcements.splice(Number(b.dataset.i),1); render(); await pushSiteContent();
  });

  document.querySelectorAll('[data-act="editPrayer"]').forEach(b=> b.onclick = ()=>{ editingPrayer = Number(b.dataset.i); render(); });
  const savePrayerBtn = el('savePrayerBtn');
  if(savePrayerBtn) savePrayerBtn.onclick = async ()=>{
    const i = Number(savePrayerBtn.dataset.i);
    const nv = el('prayerEditInput').value.trim();
    if(nv){ content.prayerTimes[i].time = nv; }
    editingPrayer = -1; render();
    if(nv) await pushSiteContent();
  };

  document.querySelectorAll('.enrollBtn').forEach(b=> b.onclick = async ()=>{
    const i=Number(b.dataset.i); const a=admissions[i];
    try{
      const {data, error} = await sb.rpc('enroll_admission', {p_username:adminUser, p_password:adminPass, p_admission_id:a.id});
      if(error) throw error;
      students.push({id:data.id, roll:data.roll, name:data.name, cls:data.cls, guardian:data.guardian, contact:data.contact});
      admissions.splice(i,1); render();
    }catch(e){ showDebugError(e.message || String(e)); }
  });
  document.querySelectorAll('.rejectAppBtn').forEach(b=> b.onclick = async ()=>{
    const i=Number(b.dataset.i); const a=admissions[i];
    try{
      const {error} = await sb.rpc('reject_admission', {p_username:adminUser, p_password:adminPass, p_id:a.id});
      if(error) throw error;
      admissions.splice(i,1); render();
    }catch(e){ showDebugError(e.message || String(e)); }
  });
  document.querySelectorAll('.delStudent').forEach(b=> b.onclick = async ()=>{
    const i=Number(b.dataset.i); const s=students[i];
    try{
      const {error} = await sb.rpc('delete_student', {p_username:adminUser, p_password:adminPass, p_id:s.id});
      if(error) throw error;
      students.splice(i,1); render();
    }catch(e){ showDebugError(e.message || String(e)); }
  });
  const addStudentForm = el('addStudentForm');
  if(addStudentForm) addStudentForm.onsubmit = async e=>{
    e.preventDefault();
    const f=new FormData(addStudentForm);
    const name=f.get('name').trim(), cls=f.get('cls').trim();
    if(!name || !cls){ el('addStudentErr').textContent = t().fillRequired; return; }
    try{
      const {data, error} = await sb.rpc('add_student', {p_username:adminUser, p_password:adminPass, p_name:name, p_cls:cls, p_guardian:f.get('guardian'), p_contact:f.get('contact')});
      if(error) throw error;
      students.push({id:data.id, roll:data.roll, name:data.name, cls:data.cls, guardian:data.guardian, contact:data.contact});
      render();
    }catch(e){ showDebugError(e.message || String(e)); }
  };
  const monthSelect = el('monthSelect');
  if(monthSelect) monthSelect.onchange = ()=>{ selectedReportMonth = monthSelect.value; render(); };

  const attDatePicker = el('attDatePicker');
  if(attDatePicker) attDatePicker.onchange = ()=>{ selectedAttDate = attDatePicker.value; render(); };
  document.querySelectorAll('.attRadio').forEach(r=> r.onchange = async ()=>{
    const useDate = selectedAttDate || new Date().toISOString().slice(0,10);
    if(!attendance[useDate]) attendance[useDate]={};
    attendance[useDate][r.dataset.sid] = r.value;
    render();
    try{
      const {error} = await sb.rpc('mark_attendance', {p_username:adminUser, p_password:adminPass, p_student_id:r.dataset.sid, p_date:useDate, p_status:r.value});
      if(error) throw error;
    }catch(e){ showDebugError(e.message || String(e)); }
  });

  const checkBtn = el('checkBtn');
  if(checkBtn) checkBtn.onclick = async ()=>{
    const q = el('checkInput').value.trim();
    const box = el('checkResult');
    if(!q) return;
    try{
      const {data, error} = await sb.rpc('get_public_attendance', {p_query:q});
      if(error) throw error;
      if(!data || !data.length){ box.innerHTML = `<div class="card"><div class="empty">${t().noResult}</div></div>`; return; }
      box.innerHTML = data.map(match=>{
        const records = (match.attendance||[]).slice().sort((a,b)=> a.date<b.date?1:-1);
        const presentCount = records.filter(r=>r.status==='present').length;
        const pct = records.length ? Math.round(presentCount/records.length*100) : 0;
        const initials = match.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
        return `
        <div class="card">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
            <div class="avatar-circle">${initials}</div>
            <div><h3 style="margin:0;">${match.name} <span class="roll">#${match.roll}</span></h3>
            <p style="color:var(--muted);font-size:13.5px;margin:2px 0 0;">${match.cls}${match.guardian ? ' · ' + t().fatherGuardian + ': ' + match.guardian : ''}</p></div>
          </div>
          <div>${t().attendancePct}: <b>${pct}%</b></div>
          <div class="progress-bar"><div style="width:${pct}%;"></div></div>
          <h3 style="margin-top:20px;">${t().attendanceHistory}</h3>
          ${records.length? `<table><tr><th>${t().dateL}</th><th>${t().present}/${t().absent}</th></tr>${records.map(r=>`<tr><td>${r.date}</td><td><span class="pill ${r.status}">${t()[r.status]}</span></td></tr>`).join('')}</table>` : `<div class="empty">—</div>`}
        </div>`;
      }).join('');
    }catch(e){ showDebugError(e.message || String(e)); }
  };

  const adminLoginBtn = el('adminLoginBtn');
  if(adminLoginBtn) adminLoginBtn.onclick = async ()=>{
    const u=el('adminUser').value.trim(), p=el('adminPass').value;
    if(!u||!p) return;
    try{
      if(adminSetupNeeded){
        const {data, error} = await sb.rpc('claim_admin', {p_username:u, p_password:p});
        if(error) throw error;
        if(data){ adminUser=u; adminPass=p; adminOK=true; adminSetupNeeded=false; await loadAdminData(); render(); }
        else { el('adminErr').textContent = t().wrongCreds; }
        return;
      }
      const {data, error} = await sb.rpc('verify_login', {p_username:u, p_password:p});
      if(error) throw error;
      if(data === 'admin'){ adminUser=u; adminPass=p; adminOK=true; await loadAdminData(); render(); }
      else { el('adminErr').textContent = t().wrongCreds; }
    }catch(e){ showDebugError(e.message || String(e)); }
  };
  const adminLogoutBtn = el('adminLogoutBtn'); if(adminLogoutBtn) adminLogoutBtn.onclick = ()=>{ adminOK=false; adminUser=null; adminPass=null; page='home'; render(); renderNav(); };
  const resetAdminBtn = el('resetAdminBtn');
  if(resetAdminBtn) resetAdminBtn.onclick = async ()=>{
    if(resetAdminBtn.dataset.armed==='1'){
      const u=el('adminUser').value.trim(), p=el('adminPass').value;
      try{
        const {data, error} = await sb.rpc('reset_admin', {p_username:u, p_password:p});
        if(error) throw error;
        if(data){ adminSetupNeeded=true; adminUser=null; adminPass=null; render(); }
        else { el('adminErr').textContent = t().wrongCreds; }
      }catch(e){ showDebugError(e.message || String(e)); }
    } else {
      resetAdminBtn.dataset.armed='1';
      resetAdminBtn.textContent = t().resetConfirmClick;
    }
  };

  const goFinanceLink = el('goFinanceLink'); if(goFinanceLink) goFinanceLink.onclick = ()=>{ page='finance'; render(); };
  const goAdminLink = el('goAdminLink'); if(goAdminLink) goAdminLink.onclick = ()=>{ page='admin'; render(); };

  document.querySelectorAll('[data-fv]').forEach(b=> b.onclick = ()=>{ financeView = b.dataset.fv; roznamchaPrintMode=false; render(); });
  document.querySelectorAll('[data-rt]').forEach(b=> b.onclick = ()=>{ roznamchaType = b.dataset.rt; render(); });

  const roznForm = el('roznForm');
  if(roznForm) roznForm.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(roznForm);
    const amount = f.get('amount'), date = f.get('date'), details = f.get('details').trim();
    const donorName = roznamchaType==='income' ? (f.get('donorName')||'').trim() : null;
    if(!amount || Number(amount)<=0 || !date || !details){ el('roznFormErr').textContent = t().fillRequired; return; }
    try{
      const {data, error} = await sb.rpc('add_finance_entry', {p_username:financeUser, p_password:financePass, p_type:roznamchaType, p_category:details, p_amount:Number(amount), p_date:date, p_note:donorName});
      if(error) throw error;
      finance.push({id:data.id, type:data.type, category:data.category, amount:data.amount, date:data.date, note:data.note, receiptNo:data.receipt_no});
      render();
      const income = finance.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0);
      const expense = finance.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
      const net = income - expense;
      const box = el('roznStatusBox');
      if(box){
        const isProfit = net >= 0;
        box.innerHTML = `<div class="card" style="background:${isProfit?'var(--ok-bg)':'var(--bad-bg)'};border-color:${isProfit?'var(--ok)':'var(--bad)'};">
          <p style="margin:0;color:${isProfit?'var(--ok)':'var(--bad)'};font-weight:700;">${isProfit ? t().entryAddedProfit : t().entryAddedLoss} Rs ${Math.abs(net).toLocaleString()}</p>
        </div>`;
      }
    }catch(e){ showDebugError(e.message || String(e)); }
  };

  document.querySelectorAll('.printReceiptBtn').forEach(b=> b.onclick = ()=>{
    receiptEntry = finance.find(f=>f.id===b.dataset.id);
    render();
  });
  const receiptCancelBtn = el('receiptCancelBtn');
  if(receiptCancelBtn) receiptCancelBtn.onclick = ()=>{ receiptEntry=null; render(); };
  const receiptDoPrint = el('receiptDoPrint');
  if(receiptDoPrint) receiptDoPrint.onclick = ()=>{ window.print(); };

  const roznPrintBtn = el('roznPrintBtn');
  if(roznPrintBtn) roznPrintBtn.onclick = ()=>{
    const entries = finance.filter(f=>f.type===roznamchaType).slice().sort((a,b)=> a.date<b.date?-1:1);
    roznamchaEditRows = JSON.parse(JSON.stringify(entries));
    roznamchaPrintMode = true;
    render();
  };
  const roznCancelPrint = el('roznCancelPrint');
  if(roznCancelPrint) roznCancelPrint.onclick = ()=>{ roznamchaPrintMode=false; render(); };
  const roznDoPrint = el('roznDoPrint');
  if(roznDoPrint) roznDoPrint.onclick = ()=>{ window.print(); };
  document.querySelectorAll('[data-plang]').forEach(b=> b.onclick = ()=>{ roznamchaPrintLang = b.dataset.plang; render(); });
  document.querySelectorAll('#printArea input[data-ri]').forEach(inp=> inp.onchange = ()=>{
    const i = Number(inp.dataset.ri), field = inp.dataset.field;
    if(field==='details'){ roznamchaEditRows[i].category = inp.value; roznamchaEditRows[i].note=null; }
    else if(field==='amount'){ roznamchaEditRows[i].amount = inp.value; }
    else { roznamchaEditRows[i][field] = inp.value; }
  });

  const finLoginBtn = el('finLoginBtn');
  if(finLoginBtn) finLoginBtn.onclick = async ()=>{
    const u=el('finUser').value.trim(), p=el('finPass').value;
    if(!u||!p) return;
    try{
      const {data, error} = await sb.rpc('verify_login', {p_username:u, p_password:p});
      if(error) throw error;
      if(data === 'finance'){ financeUser=u; financePass=p; financeOK=true; await loadFinanceData(); render(); }
      else { el('finErr').textContent = t().wrongCreds; }
    }catch(e){ showDebugError(e.message || String(e)); }
  };
  const finLogoutBtn = el('finLogoutBtn'); if(finLogoutBtn) finLogoutBtn.onclick = ()=>{ financeOK=false; financeUser=null; financePass=null; financeView='dashboard'; roznamchaPrintMode=false; page='home'; render(); renderNav(); };

  const finForm = el('finForm');
  const categorySelect = el('categorySelect');
  if(categorySelect) categorySelect.onchange = ()=>{ el('categoryOther').style.display = categorySelect.value==='__other' ? 'block' : 'none'; };
  if(finForm) finForm.onsubmit = async e=>{
    e.preventDefault();
    const f=new FormData(finForm);
    const amount=f.get('amount'), date=f.get('date');
    if(!amount || Number(amount)<=0 || !date){ el('finFormErr').textContent = t().fillRequired; return; }
    const cat = f.get('categorySelect')==='__other' ? f.get('categoryOther').trim() : f.get('categorySelect');
    try{
      const {data, error} = await sb.rpc('add_finance_entry', {p_username:financeUser, p_password:financePass, p_type:f.get('type'), p_category:cat||'Other', p_amount:Number(amount), p_date:date, p_note:f.get('note')});
      if(error) throw error;
      finance.push({id:data.id, type:data.type, category:data.category, amount:data.amount, date:data.date, note:data.note, receiptNo:data.receipt_no});
      render();
    }catch(e){ showDebugError(e.message || String(e)); }
  };
  document.querySelectorAll('.delFin').forEach(b=> b.onclick = async ()=>{
    const idx = Number(b.dataset.i); const rec = finance[idx];
    try{
      const {error} = await sb.rpc('delete_finance_entry', {p_username:financeUser, p_password:financePass, p_id:rec.id});
      if(error) throw error;
      finance.splice(idx,1); render();
    }catch(e){ showDebugError(e.message || String(e)); }
  });
  const csvBtn = el('csvBtn');
  if(csvBtn) csvBtn.onclick = ()=>{
    const rows=[['Date','Type','Category','Amount','Note'], ...finance.map(f=>[f.date,f.type,f.category,f.amount,f.note||''])];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='finance-ledger.csv'; a.click();
  };
}

el('btnEN').onclick = ()=> setLang('en');
el('btnUR').onclick = ()=> setLang('ur');
el('bellBtn').onclick = ()=>{ bellOpen=!bellOpen; el('bellPanel').style.display = bellOpen?'block':'none'; };
document.addEventListener('click', e=>{ if(bellOpen && !el('bellWrap').contains(e.target)){ bellOpen=false; el('bellPanel').style.display='none'; } });

el('hamburgerBtn').onclick = openMobile;
el('mobileDrawer').onclick = e=>{ if(e.target.id==='mobileDrawer') closeMobile(); };

// Hidden admin/finance access: press "H" three times within 2 seconds (matches live site convention)
document.addEventListener('keydown', e=>{
  if(e.key && e.key.toLowerCase()==='h'){
    hKeyCount++;
    clearTimeout(hKeyTimer);
    hKeyTimer = setTimeout(()=>{ hKeyCount=0; }, 2000);
    if(hKeyCount>=3){
      hKeyCount=0;
      page = 'admin';
      render(); renderNav();
    }
  }
});

// Direct link access for mobile (bookmark https://yoursite/#admin or #finance)
if(location.hash === '#admin') page = 'admin';
if(location.hash === '#finance') page = 'finance';

el('footNote').textContent = t().footNote;
renderNav();
loadAll();
</script>
</body>
</html>
